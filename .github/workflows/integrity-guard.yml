name: Integrity Guard tests

on:
  push:
    paths:
      - 'integrity-guard/**'
      - '.github/workflows/integrity-guard.yml'
  pull_request:
    paths:
      - 'integrity-guard/**'
      - '.github/workflows/integrity-guard.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: integrity-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check source syntax
        run: python -m compileall -q integrity_guard
