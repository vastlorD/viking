name: Ponto Facial tests

on:
  push:
    paths:
      - 'ponto-facial/**'
      - '.github/workflows/ponto-facial.yml'
  pull_request:
    paths:
      - 'ponto-facial/**'
      - '.github/workflows/ponto-facial.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: ponto-facial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run unit and HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: Check source syntax
        run: python -m compileall -q ponto admin.py colaborador.py
