[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "integrity-guard-local"
version = "1.0.0"
description = "Monitor local de integridade de arquivos com SHA-256 e bases assinadas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vastlorD" }]
dependencies = []

[project.scripts]
integrity-guard = "integrity_guard.cli:main"

[tool.setuptools.packages.find]
include = ["integrity_guard*"]
